<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <meta name="theme-color" content="#1a1a2e">

  <!-- Mobile Essential Meta Tags -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <title>Meet4U</title>
  <style>
    @keyframes gs25ZoomPulse {
      0%   { transform: scale(0.92); opacity: 0.45; }
      50%  { transform: scale(1.08); opacity: 0.75; }
      100% { transform: scale(0.92); opacity: 0.45; }
    }
    @keyframes gs25FadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .splash-wrap {
      position: fixed; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: 100vh; background: #1a1a2e; font-family: sans-serif; overflow: hidden;
    }
    .splash-img {
      max-width: 92vw; max-height: 70vh;
      width: auto; height: auto;
      border-radius: 12px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
      animation: gs25ZoomPulse 2.6s ease-in-out infinite;
      will-change: transform, opacity;
    }
    .splash-title {
      color: #fff; font-size: 22px; margin: 24px 0 6px 0;
      letter-spacing: 0.5px; animation: gs25FadeUp 0.6s ease-out 0.1s both;
    }
    .splash-sub {
      color: rgba(255,255,255,0.55); font-size: 13px; margin: 0;
      animation: gs25FadeUp 0.6s ease-out 0.25s both;
    }
  </style>
</head>

<body>
  <div id="root">
    <div class="splash-wrap">
      <img class="splash-img" src="/gs25-splash.jpg" alt="Global Standard GS25" />
      <h1 class="splash-title">PromiseU</h1>
      <p class="splash-sub">로딩 중...</p>
    </div>
  </div>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (registrations) {
        for (let registration of registrations) {
          console.log('Unregistering SW:', registration);
          registration.unregister();
        }
      });
    }
  </script>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
