<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <meta name="theme-color" content="#1a1a2e">

  <!-- PWA Manifest — pwabuilder.com / Play Store 용 -->
  <link rel="manifest" href="/manifest.json">

  <!-- 카카오톡 링크 카드 (og:tag) — 오픈채팅 공지 붙여넣기 시 썸네일 노출 -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="PromiseU">
  <meta property="og:title" content="🎾 게스트 모집 · 고양·파주·김포 테니스">
  <meta property="og:description" content="모집 현황 · 자동 마감 · 대기열 · 1/N 정산까지 한눈에">
  <meta property="og:image" content="/pwa-512x512.png">
  <meta property="og:url" content="https://hanguk.netlify.app/guest-meetups">
  <meta name="twitter:card" content="summary_large_image">

  <!-- Paperlogy 폰트 빠른 연결 (CSS @font-face 가 jsDelivr 에서 woff2 로드) -->
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="dns-prefetch" href="https://cdn.jsdelivr.net">

  <!-- Mobile Essential Meta Tags -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="PromiseU">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="application-name" content="PromiseU">

  <title>PromiseU</title>
  <script>
    // Apply saved theme before any rendering to avoid flash of unstyled content
    try {
      var __t = localStorage.getItem('meet4u_theme');
      if (__t === 'galaxy' || __t === 'paper') {
        document.documentElement.classList.add('theme-' + __t);
      }
    } catch (_) { /* ignore */ }
  </script>
  <style>
    @keyframes gs25ZoomPulse {
      0%   { transform: scale(0.92); opacity: 0.45; }
      50%  { transform: scale(1.08); opacity: 0.75; }
      100% { transform: scale(0.92); opacity: 0.45; }
    }
    @keyframes gs25FadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .splash-wrap {
      position: fixed; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: 100vh; background: #1a1a2e; overflow: hidden;
      font-family: 'Paperlogy', system-ui, -apple-system, BlinkMacSystemFont,
                   'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    }
    .splash-img {
      max-width: 92vw; max-height: 70vh;
      width: auto; height: auto;
      border-radius: 12px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
      animation: gs25ZoomPulse 2.6s ease-in-out infinite;
      will-change: transform, opacity;
    }
    .splash-title {
      color: #fff; font-size: 22px; margin: 24px 0 6px 0;
      letter-spacing: 0.5px; animation: gs25FadeUp 0.6s ease-out 0.1s both;
    }
    .splash-sub {
      color: rgba(255,255,255,0.55); font-size: 13px; margin: 0;
      animation: gs25FadeUp 0.6s ease-out 0.25s both;
    }
  </style>
</head>

<body>
  <div id="root">
    <div class="splash-wrap">
      <img class="splash-img" src="/gs25-splash.jpg" alt="Global Standard GS25" />
      <h1 class="splash-title">PromiseU</h1>
      <p class="splash-sub">로딩 중...</p>
    </div>
  </div>
  <script>
    // PWA Service Worker 등록.
    // /sw.js 하나에 PWA 오프라인 캐싱 + Firebase Cloud Messaging 을 통합했다.
    // 예전 버전 앱에서 registered 되어 있던 다른 SW (firebase-messaging-sw.js
    // 등) 가 함께 살아 있으면 캐시가 뒤죽박죽되고 알림도 중복되므로, 등록
    // 직후에 /sw.js 이외의 registration 은 전부 unregister 해서 활성 SW 를
    // 하나로 정리한다.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker
          .register('/sw.js', { scope: '/' })
          .then(function (reg) {
            console.log('[PWA] SW registered, scope:', reg.scope);
            return navigator.serviceWorker.getRegistrations();
          })
          .then(function (regs) {
            if (!regs) return;
            regs.forEach(function (r) {
              try {
                var url = (r.active && r.active.scriptURL) || '';
                if (url && !url.endsWith('/sw.js')) {
                  console.log('[PWA] Removing stale SW:', url);
                  r.unregister();
                }
              } catch (_) { /* ignore */ }
            });
          })
          .catch(function (err) {
            console.warn('[PWA] SW registration failed:', err);
          });
      });
    }
  </script>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
