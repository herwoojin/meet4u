[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# 정기 모임 알림(1시간 전 · 30분 전 위치 공유) + 끝난 모임의 자동 위치 공유 정리 — 5분마다.
[functions."meeting-reminders"]
  schedule = "*/5 * * * *"

# 주의: public/_redirects 가 이 파일의 규칙보다 먼저 처리된다.
# 게스트 공유 링크(/?guest=) 규칙은 그 파일에 있다 — 여기 두면 그쪽 catch-all 에 먼저 잡혀 동작하지 않는다.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
